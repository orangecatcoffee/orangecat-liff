<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maewsom Beans Selection - เลือกเมล็ดกาแฟ</title>
<link rel="apple-touch-icon" href="icon-mascot.png">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Abril+Fatface&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --kraft:#C69C6D; --ink:#2A1A0E; --paper:#F7F2E7; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{background:var(--kraft);color:var(--ink);font-family:'Mitr','Noto Sans Thai','Sarabun',system-ui,sans-serif;min-height:100vh;}
button{font-family:inherit;color:inherit;}
.wrap{max-width:620px;margin:0 auto;padding:30px 26px 56px;}
.top h1{font-family:'Abril Fatface','Mitr',Georgia,serif;font-weight:400;font-size:21px;line-height:1.3;}
.top p{font-size:12.5px;margin-top:6px;font-weight:300;opacity:.8;}
.top{margin-bottom:22px;}
.pgb{display:none;background:rgba(247,242,231,.55);border:1px solid rgba(42,26,14,.25);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.55;margin-bottom:22px;font-weight:300;}
.fl{font-size:12px;font-weight:300;opacity:.85;margin-bottom:9px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:400;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--d,#999);}
.chip.on{background:var(--ink);color:var(--paper);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 14px;align-items:start;}
.state{font-size:13px;font-weight:300;padding:30px 0;text-align:center;opacity:.85;grid-column:1/-1;}

/* STAMP LABEL — ratio 7:12 */
.card{container-type:inline-size;aspect-ratio:7/12;background:var(--paper);color:#231810;box-shadow:0 3px 8px rgba(60,35,10,.26);text-align:left;width:100%;cursor:pointer;position:relative;overflow:hidden;}
.in{display:flex;flex-direction:column;height:100%;padding:4.8cqw 4.8cqw 4cqw;}
.art{position:relative;flex:0 0 auto;width:100%;aspect-ratio:1/1.02;border:2.3cqw dotted var(--paper);background-color:var(--c,#C9A44A);background-size:cover;background-position:center;}
.art.ph{display:grid;place-items:center;background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28),transparent 60%);}
.art.ph span{font:italic 300 6.5cqw 'Mitr',sans-serif;color:rgba(255,255,255,.92);}
.stk{position:absolute;top:2cqw;left:2cqw;font-weight:500;font-size:4.6cqw;line-height:1.5;padding:0 2.6cqw;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.4);background:#E8B23A;color:#2a1a05;}
.tag{position:absolute;top:0;left:0;z-index:3;font-weight:500;font-size:4.7cqw;line-height:1.5;padding:.4cqw 3.4cqw .6cqw 2.6cqw;border-radius:0 0 3cqw 0;box-shadow:0 1px 3px rgba(0,0,0,.35);}
.tag.store{background:#E8621A;color:#fff;}
.tag.limited{background:#6E1F2C;color:#F7F2E7;}
.name{flex:0 0 17cqw;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Abril Fatface','Mitr',Georgia,serif;font-weight:400;line-height:1.1;padding:0 1cqw;}
.name.l1{font-size:11cqw;}.name.l2{font-size:8.6cqw;}.name.l3{font-size:6.8cqw;}
.rule{flex:0 0 auto;border:none;border-top:.35cqw solid rgba(35,24,16,.45);}
.rule.dbl{border-top:1cqw double rgba(35,24,16,.45);}
.g2{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;}
.gc{padding:1.6cqw 2.2cqw 1.8cqw;min-width:0;}
.gc:nth-child(1){border-right:.35cqw solid rgba(35,24,16,.45);}
.gc:nth-child(n+3){border-top:.35cqw solid rgba(35,24,16,.45);grid-column:1/-1;}
.gc small{display:block;font-family:'Caveat','Mitr',cursive;font-size:6.6cqw;line-height:1;}
.gc .v{font-size:5.4cqw;line-height:1.3;font-weight:400;margin-top:.4cqw;overflow-wrap:anywhere;}
.gc .v .sub{color:#7a6556;font-weight:300;}
.desc{flex:1 1 auto;display:flex;gap:2.4cqw;align-items:flex-start;padding:2.8cqw 1cqw 0;font-size:4.9cqw;line-height:1.4;font-weight:300;overflow:hidden;min-height:0;}
.desc svg{flex:0 0 9cqw;width:9cqw;height:9cqw;margin-top:.4cqw;}
.tbc{color:#8a7868;font-weight:300;font-style:italic;}

.veil{position:fixed;inset:0;background:rgba(30,16,6,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;}
.veil.on{display:flex;}
.veil .card{width:min(86vw,360px);cursor:default;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:visible;}
.veil .in{height:auto;}
.veil .desc{overflow:visible;padding-bottom:3cqw;}
.veil p{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#F7F2E7;font-size:12px;font-weight:300;opacity:.85;}
.foot{font-size:11px;line-height:1.7;margin-top:46px;font-weight:300;opacity:.8;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">กำลังโหลด…</div></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div id="big"></div><p>แตะที่ว่างเพื่อปิด</p></div>

<script>
const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const LIFF_ID = ""; // ใส่ LIFF ID ของหน้านี้ (สร้างใน LINE Developers Console ชี้มาที่ /beans.html) — ว่างไว้ = ไม่ระบุตัวสมาชิก ใช้ ?g=<กลุ่มราคา> หรือราคามาตรฐาน
const BEAN_DOSE_G = 20; // เกณฑ์เดียวกับ order.html / brew.html — สต็อกต้อง >= นี้ถึงจะโชว์/สั่งได้

const TONES = [
  {id:'choc',   label:'ช็อกโกแลต · นัท', d:'#7A4A2B'},
  {id:'fruit',  label:'ผลไม้',          d:'#D9546E'},
  {id:'citrus', label:'ซิตรัส',         d:'#E8A33A'},
  {id:'floral', label:'ดอกไม้',         d:'#7FA38B'},
  {id:'sweet',  label:'หวาน · ครีมมี่',  d:'#C98A5A'}
];
const RANK = {store:0, limited:1, '':2};
const CUP = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#B8902F" stroke-width="1.7"/><path d="M7.5 11h9v2.2a4.5 4.5 0 0 1-9 0z" fill="none" stroke="#B8902F" stroke-width="1.6"/><path d="M16.5 11.6h1a1.4 1.4 0 0 1 0 2.8h-1" fill="none" stroke="#B8902F" stroke-width="1.5"/></svg>';
const TBC = '<span class="tbc">รอยืนยัน</span>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const v = x => x ? esc(x) : TBC;

let group = {key:'standard', label_th:'Standard Price', discount_per_cup:0};
let identified = false;          // รู้กลุ่มราคาของคนที่เปิดหน้านี้จริงไหม (LIFF หรือ ?g=)
let settings = {enabled:true, showCupPrice:true, refs:[]};
let refMenus = [];               // [{name, price}] ราคากลางจาก menu_items
let beans = [];
let loaded = false, failed = false;
const sel = new Set();

async function resolveGroup(){
  let key = new URLSearchParams(location.search).get('g');
  if (key) identified = true;
  if (LIFF_ID) {
    try {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      await liff.init({liffId: LIFF_ID});
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const prof = await liff.getProfile();
      const { data: m } = await sb.from('members').select('price_group').eq('line_user_id', prof.userId).maybeSingle();
      if (m) { key = m.price_group || 'standard'; identified = true; }
    } catch (e) { /* ใช้ราคามาตรฐาน */ }
  }
  try {
    const { data: pg } = await sb.from('price_groups').select('key,label_th,discount_per_cup').eq('key', key || 'standard').eq('active', true).maybeSingle();
    if (pg) group = {key: pg.key, label_th: pg.label_th, discount_per_cup: Number(pg.discount_per_cup) || 0};
    else identified = false;
  } catch (e) { /* ราคากลาง */ }
}

async function load(){
  try {
    await resolveGroup();
    const { data: st } = await sb.from('system_settings').select('key,value').like('key', 'beans_page.%');
    const S = {}; (st || []).forEach(r => S[r.key] = r.value);
    settings.enabled = S['beans_page.enabled'] !== false && S['beans_page.enabled'] !== 'false';
    settings.showCupPrice = S['beans_page.show_cup_price'] !== false && S['beans_page.show_cup_price'] !== 'false';
    settings.refs = [S['beans_page.ref_menu_1'], S['beans_page.ref_menu_2']].filter(x => typeof x === 'string' && x.trim());
    if (settings.showCupPrice && settings.refs.length) {
      const { data: mi } = await sb.from('menu_items').select('name,price').in('name', settings.refs);
      refMenus = settings.refs.map(n => (mi || []).find(m => m.name === n)).filter(m => m && Number(m.price) > 0).map(m => ({name: m.name, price: Number(m.price)}));
    }
    const { data, error } = await sb.from('bean_profiles')
      .select('*, ingredients!inner(id, name, active, stock_quantity, customer_bean_surcharge)')
      .eq('visible', true).eq('ingredients.active', true).gte('ingredients.stock_quantity', BEAN_DOSE_G);
    if (error) throw error;
    beans = (data || []).map(p => ({
      id: p.ingredient_id, name: p.ingredients.name, surcharge: Number(p.ingredients.customer_bean_surcharge) || 0,
      photo: p.photo_url, pos: p.photo_pos, roast: p.roast, body: p.body, notes: p.notes, tones: p.tones || [], status: p.status || '',
      house: !!p.house_pick, sort: p.sort_order || 0
    })).sort((a, b) => (RANK[a.status] - RANK[b.status]) || (a.sort - b.sort) || a.name.localeCompare(b.name));
  } catch (e) { failed = true; }
  loaded = true; render();
}

function priceHTML(b){
  if (settings.showCupPrice && refMenus.length) {
    const prices = refMenus.map(m => '฿' + (Math.max(0, m.price - (group.discount_per_cup || 0)) + b.surcharge));
    const names = refMenus.map(m => esc(String(m.name).replace(/^Iced\s+/i, '')));
    return '<b>' + prices.join(' · ') + '</b><br><span class="sub">' + names.join(' · ') + (b.surcharge > 0 ? ' · รวมเมล็ดนี้ +' + b.surcharge + '฿' : '') + '</span>';
  }
  return b.surcharge > 0 ? '+' + b.surcharge + '฿ ต่อแก้ว' : 'ไม่บวกเพิ่ม';
}
function cardHTML(b, attrs){
  const L = b.name.length <= 11 ? 'l1' : (b.name.length <= 17 ? 'l2' : 'l3');
  const art = b.photo
    ? `<div class="art" style="background-image:url('${esc(b.photo)}');background-position:${esc(b.pos || 'center')}">`
    : `<div class="art ph" style="--c:#8A6A4A"><span>รอรูป</span>`;
  const tag = b.status === 'store' ? '<span class="tag store">เมล็ดประจำร้าน</span>' : b.status === 'limited' ? '<span class="tag limited">Limited</span>' : '';
  return `<div class="card" ${attrs || ''}>${tag}<div class="in">${art}${b.house ? '<span class="stk">⭐ House Pick</span>' : ''}</div>
    <div class="name ${L}">${esc(b.name)}</div>
    <hr class="rule dbl">
    <div class="g2">
      <div class="gc"><small>Roast</small><div class="v">${v(b.roast)}</div></div>
      <div class="gc"><small>Body</small><div class="v">${v(b.body)}</div></div>
      <div class="gc"><small>Price</small><div class="v">${priceHTML(b)}</div></div>
    </div>
    <hr class="rule">
    <div class="desc">${CUP}<span>${v(b.notes)}</span></div></div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if (!loaded) return;
  const list = beans.filter(b => sel.size === 0 || b.tones.some(t => sel.has(t)));
  let body;
  if (failed) body = '<div class="state">โหลดข้อมูลไม่สำเร็จ ลองเปิดหน้านี้ใหม่อีกครั้งนะคะ</div>';
  else if (!settings.enabled) body = '<div class="state">หน้าเมล็ดกาแฟกำลังเตรียมตัว เร็วๆ นี้นะคะ 🐱</div>';
  else if (!list.length) body = '<div class="state">' + (sel.size ? 'ยังไม่มีเมล็ดในโทนนี้' : 'ยังไม่มีเมล็ดในรายการ') + '</div>';
  else body = list.map(b => cardHTML(b, `role="button" tabindex="0" data-id="${esc(b.id)}"`)).join('');
  let banner = '';
  if (settings.enabled && settings.showCupPrice && refMenus.length) {
    if (group.discount_per_cup > 0) banner = `🏢 ราคาสมาชิก${esc(group.label_th)} — ลด ฿${group.discount_per_cup} ต่อแก้วจากราคามาตรฐาน (ราคาที่เห็นเป็นราคาของคุณแล้ว)`;
    else if (!identified) banner = 'ราคาที่เห็นเป็นราคามาตรฐาน — สมาชิกกลุ่มราคาพิเศษจะได้ราคาของตัวเองตอนสั่งผ่าน LINE';
  }
  app.innerHTML = `
    <div class="top"><h1>Maewsom Beans Selection - เลือกเมล็ดกาแฟ</h1>
      <p>${settings.enabled && !failed ? 'เมล็ดกาแฟในร้านตอนนี้ ' + beans.length + ' รายการ · แตะการ์ดเพื่อขยาย' : ''}</p></div>
    ${banner ? `<div class="pgb" style="display:block">${banner}</div>` : ''}
    ${settings.enabled && !failed ? `<div class="fl">เลือกโทนรสที่ชอบ</div>
    <div class="chips">
      <button class="chip ${sel.size === 0 ? 'on' : ''}" data-tone="">ทั้งหมด</button>
      ${TONES.map(t => `<button class="chip ${sel.has(t.id) ? 'on' : ''}" style="--d:${t.d}" data-tone="${t.id}"><i></i>${esc(t.label)}</button>`).join('')}
    </div>` : ''}
    <div class="grid3">${body}</div>
    <p class="foot">รสชาติและระดับคั่วมาจากบันทึกที่ยืนยันแล้ว ส่วนที่ยังไม่มีบันทึกแสดงว่า “รอยืนยัน” · เมล็ดที่สต็อกหมดจะไม่แสดงในหน้านี้</p>`;
}

document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-tone]');
  if (t) { const id = t.dataset.tone; if (!id) sel.clear(); else if (sel.has(id)) sel.delete(id); else sel.add(id); render(); return; }
  const c = e.target.closest('.card[data-id]');
  if (c) { const b = beans.find(x => String(x.id) === c.dataset.id); if (b) { document.getElementById('big').innerHTML = cardHTML(b, ''); document.getElementById('veil').classList.add('on'); } }
});
document.getElementById('app').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.id) { e.preventDefault(); e.target.click(); } });
document.getElementById('veil').addEventListener('click', () => document.getElementById('veil').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('veil').classList.remove('on'); });

load();
</script>
</body>
</html>
