<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รู้จักกันหน่อย - กาแฟแมวส้ม</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #FFF8F0;
    color: #4A3428;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 0 40px; }
  .wrap-inner { padding: 28px 20px 0; }

  .top-photo {
    width: 100%; aspect-ratio: 2/1; object-fit: cover;
    display: block; margin: 0 0 20px;
  }
  .gtky-title { font-size: 24px; text-align: center; font-weight: 800; margin-bottom: 6px; color: #E8863A; }
  .gtky-subtitle { font-size: 13px; text-align: center; color: #8a6a4a; line-height: 1.5; margin-bottom: 24px; }
  h1 { font-size: 19px; text-align: center; line-height: 1.5; margin-bottom: 26px; font-weight: 600; }

  .opt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .opt {
    background: #fff; border: 2px solid #F0E0CE; border-radius: 14px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s;
    font-size: 14px; text-align: center;
  }
  .opt.selected { border-color: #E8863A; background: #FFF3E8; font-weight: 600; }

  textarea {
    width: 100%; border: 2px solid #F0E0CE; border-radius: 14px; padding: 12px 14px;
    font-size: 16px; font-family: inherit; resize: vertical; margin-bottom: 22px;
    background: #fff;
  }
  textarea:focus { outline: none; border-color: #E8863A; }

  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 999px;
    background: #E8863A; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { background: #E0C8AC; cursor: not-allowed; }

  .status-msg { text-align: center; font-size: 13px; margin-top: 14px; color: #C0392B; }

  .note-label { font-size: 12px; color: #8a6a4a; margin: 10px 0 6px; }
  .note-field {
    width: 100%; border: 2px solid #F0E0CE; border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; resize: vertical; background: #fff;
    margin-bottom: 0;
  }
  .note-field:focus { outline: none; border-color: #E8863A; }
  .note-field::placeholder { color: #C9B49A; }

  .done-wrap { text-align: center; padding: 0 0 60px; }
  .done-wrap .top-photo { margin: 0; }
  .done-wrap h2 { font-size: 24px; font-weight: 800; color: #E8863A; margin-top: 24px; padding: 0 20px; }
  .done-wrap p { font-size: 13px; color: #8a6a4a; padding: 0 20px; margin-top: 8px; }

  .q-block { margin-bottom: 28px; }
  .q-block .q-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
  .q-block .opt-list { margin-bottom: 0; }
  .q-block textarea { margin-bottom: 0; }
  #batchIntro { font-size: 13px; text-align: center; color: #8a6a4a; margin-bottom: 22px; }
</style>
</head>
<body>

<div class="wrap" id="formWrap">
  <img class="top-photo" src="https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/IMG_9447.jpeg" alt="อาบุ้งงง">
  <div class="wrap-inner">
  <div class="gtky-title">Let's get to know you!</div>
  <div class="gtky-subtitle">ทำความรู้จักกันสักนิด แต่คงทำตามบ้างไม่ทำตามบ้าง แค่อยากรู้เฉยๆ</div>
  <h1 id="questionText" style="display:none;">กำลังโหลดคำถาม...</h1>
  <div id="batchIntro" style="display:none;"></div>

  <div class="opt-list" id="optList" style="display:none;"></div>
  <textarea id="freeText" rows="3" maxlength="300" placeholder="พิมพ์คำตอบที่นี่..." style="display:none;"></textarea>

  <div id="noteWrap" style="display:none;">
    <div class="note-label">หมายเหตุ (ไม่บังคับ)</div>
    <textarea class="note-field" id="noteField" rows="2" maxlength="200" placeholder="จะเขียนก็เขียนนะ เป็นคนง่ายก็ว่างไว้"></textarea>
  </div>

  <div id="batchWrap" style="display:none;"></div>

  <button class="btn" id="submitBtn" disabled>กำลังโหลด...</button>
  <div class="status-msg" id="statusMsg" style="display:none;"></div>
  </div>
</div>

<div class="done-wrap" id="doneWrap" style="display:none;">
  <img class="top-photo" src="https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/IMG_9447.jpeg" alt="อาบุ้งงง">
  <h2>ขอบคุณนะคะ!</h2>
  <p>อาบุ้งจะรู้จักคุณมากขึ้นอีกนิดแล้ว</p>
</div>

<script>
  const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // TODO(Fah): ต้องสร้าง LIFF App ใหม่ใน LINE Developers Console สำหรับหน้านี้โดยเฉพาะ
  // (endpoint URL ชี้มาที่ gtky.html) แล้วเอา LIFF ID มาใส่แทนค่านี้
  const LIFF_ID = "2010600301-LuXVMYwg";

  function resolveParams() {
    const params = new URLSearchParams(window.location.search);
    let gtky = params.get('gtky');
    let batch = params.get('batch');
    if (!gtky && !batch) {
      const liffState = params.get('liff.state');
      if (liffState) {
        const decoded = decodeURIComponent(liffState);
        const qsPart = decoded.includes('?') ? decoded.split('?')[1] : decoded.replace(/^\//, '');
        const qs = new URLSearchParams(qsPart);
        gtky = qs.get('gtky');
        batch = qs.get('batch');
      }
    }
    if (batch) return { mode: 'batch', id: batch };
    if (gtky) return { mode: 'single', id: gtky };
    return { mode: null, id: null };
  }
  const { mode, id: targetId } = resolveParams();

  let selectedOption = null;
  let hasOptions = false;
  let questionTextCache = '';
  let batchRows = [];
  const NOTIFY_SHOP_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co/functions/v1/notify-shop-gtky";

  function showError(msg) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function showDone() {
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('doneWrap').style.display = 'block';
  }

  function updateSubmitBtn() {
    const btn = document.getElementById('submitBtn');
    if (mode === 'batch') {
      const allAnswered = batchRows.length > 0 && batchRows.every(r =>
        r.hasOptions ? !!r.selected : document.getElementById('bt_' + r.id).value.trim().length > 0
      );
      btn.disabled = !allAnswered;
      btn.textContent = 'ส่งคำตอบทั้งหมด';
      return;
    }
    if (hasOptions) {
      btn.disabled = !selectedOption;
    } else {
      btn.disabled = document.getElementById('freeText').value.trim().length === 0;
    }
    btn.textContent = 'ส่งคำตอบ';
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    if (!targetId) { showError('ลิงก์ไม่ถูกต้อง'); return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังส่ง...';

    if (mode === 'batch') {
      try {
        const answered = batchRows.map(r => ({
          id: r.id,
          question_text: r.question_text,
          answer: r.hasOptions ? r.selected : document.getElementById('bt_' + r.id).value.trim(),
          note: document.getElementById('bnote_' + r.id).value.trim(),
        }));

        for (const a of answered) {
          const { error } = await sb.from('gtky_sends')
            .update({ answer_text: a.answer, note: a.note || null, responded_at: new Date().toISOString() })
            .eq('id', a.id);
          if (error) throw error;
        }

        let customerDisplayName = '';
        try {
          const profile = await liff.getProfile();
          customerDisplayName = profile.displayName || '';
        } catch (e) { /* เปิดนอก LINE ไม่มีโปรไฟล์ให้ดึง เงียบไว้ */ }

        answered.forEach(a => {
          fetch(NOTIFY_SHOP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question_text: a.question_text, answer_text: a.answer, note: a.note, customer_name: customerDisplayName }),
          }).catch(err => console.error('notify-shop-gtky failed:', err));
        });

        showDone();
      } catch (e) {
        showError('ส่งไม่สำเร็จ: ' + e.message);
        btn.disabled = false;
        updateSubmitBtn();
      }
      return;
    }

    const answer = hasOptions ? selectedOption : document.getElementById('freeText').value.trim();
    const note = document.getElementById('noteField').value.trim();

    const { error } = await sb.from('gtky_sends')
      .update({ answer_text: answer, note: note || null, responded_at: new Date().toISOString() })
      .eq('id', targetId);

    if (error) {
      showError('ส่งไม่สำเร็จ: ' + error.message);
      btn.disabled = false;
      updateSubmitBtn();
      return;
    }

    let customerDisplayName = '';
    try {
      const profile = await liff.getProfile();
      customerDisplayName = profile.displayName || '';
    } catch (e) { /* เปิดนอก LINE ไม่มีโปรไฟล์ให้ดึง เงียบไว้ */ }

    fetch(NOTIFY_SHOP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_text: questionTextCache, answer_text: answer, note: note, customer_name: customerDisplayName }),
    }).catch(err => console.error('notify-shop-gtky failed:', err));

    showDone();
  });

  async function initBatch() {
    const { data, error } = await sb.from('gtky_sends')
      .select('id, responded_at, batch_order, gtky_questions(question_text, options, placeholder_hint)')
      .eq('batch_id', targetId)
      .order('batch_order', { ascending: true, nullsFirst: false });

    if (error || !data || !data.length) { showError('ไม่พบชุดคำถามนี้'); return; }

    const unanswered = data.filter(r => !r.responded_at);
    if (!unanswered.length) { showDone(); return; }

    batchRows = unanswered.map(r => ({
      id: r.id,
      question_text: r.gtky_questions.question_text,
      options: r.gtky_questions.options,
      placeholderHint: r.gtky_questions.placeholder_hint,
      hasOptions: !!(r.gtky_questions.options && Array.isArray(r.gtky_questions.options) && r.gtky_questions.options.length > 0),
      selected: null,
    }));

    const wrap = document.getElementById('batchWrap');
    wrap.style.display = 'block';
    wrap.innerHTML = batchRows.map((r, i) => `
      <div class="q-block">
        <div class="q-title">${i + 1}. ${r.question_text}</div>
        ${r.hasOptions
          ? `<div class="opt-list" id="bo_${r.id}">${r.options.map(opt => `<div class="opt" data-val="${opt.replace(/"/g,'&quot;')}">${opt}</div>`).join('')}</div>`
          : `<textarea id="bt_${r.id}" rows="2" maxlength="300" placeholder="${(r.placeholderHint || 'พิมพ์คำตอบที่นี่...').replace(/"/g,'&quot;')}"></textarea>`
        }
        <div class="note-label">หมายเหตุ (ไม่บังคับ)</div>
        <textarea class="note-field" id="bnote_${r.id}" rows="2" maxlength="200" placeholder="จะเขียนก็เขียนนะ เป็นคนง่ายก็ว่างไว้"></textarea>
      </div>
    `).join('');

    batchRows.forEach(r => {
      if (r.hasOptions) {
        const listEl = document.getElementById('bo_' + r.id);
        listEl.querySelectorAll('.opt').forEach(el => {
          el.addEventListener('click', () => {
            listEl.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            r.selected = el.dataset.val;
            updateSubmitBtn();
          });
        });
      } else {
        document.getElementById('bt_' + r.id).addEventListener('input', updateSubmitBtn);
      }
    });

    updateSubmitBtn();
  }

  async function initSingle() {
    const { data, error } = await sb.from('gtky_sends')
      .select('id, responded_at, gtky_questions(question_text, options, placeholder_hint)')
      .eq('id', targetId)
      .maybeSingle();

    if (error || !data) { showError('ไม่พบคำถามนี้'); return; }
    if (data.responded_at) { showDone(); return; }

    const q = data.gtky_questions;
    questionTextCache = q.question_text;
    const qEl = document.getElementById('questionText');
    qEl.style.display = 'block';
    qEl.textContent = q.question_text;

    document.getElementById('noteWrap').style.display = 'block';

    if (q.options && Array.isArray(q.options) && q.options.length > 0) {
      hasOptions = true;
      const listEl = document.getElementById('optList');
      listEl.style.display = 'flex';
      listEl.innerHTML = q.options.map(opt => `<div class="opt" data-val="${opt.replace(/"/g,'&quot;')}">${opt}</div>`).join('');
      listEl.querySelectorAll('.opt').forEach(el => {
        el.addEventListener('click', () => {
          listEl.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
          selectedOption = el.dataset.val;
          updateSubmitBtn();
        });
      });
    } else {
      hasOptions = false;
      const ta = document.getElementById('freeText');
      ta.style.display = 'block';
      if (q.placeholder_hint) ta.placeholder = q.placeholder_hint;
      ta.addEventListener('input', updateSubmitBtn);
    }

    updateSubmitBtn();
  }

  async function init() {
    if (!targetId || !mode) { showError('ลิงก์ไม่ถูกต้อง'); return; }

    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
    } catch (e) {
      // เปิดนอก LINE (เทสตรงๆ) — ปล่อยให้ทำต่อได้
    }

    if (mode === 'batch') {
      await initBatch();
    } else {
      await initSingle();
    }
  }

  init();
</script>

</body>
</html>
