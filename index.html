<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>เมนู — กาแฟแมวส้ม</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --cream:#F7EDE0; --orange:#E8621A; --brown:#5A361B; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    font-family:'Mitr',sans-serif;
    background:var(--cream);
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }

  .collection-fab{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:60;
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#E8621A,#F0894A);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; text-decoration:none;
    box-shadow:0 4px 14px rgba(232,98,26,0.4);
  }

  .page-title{
    padding:calc(18px + env(safe-area-inset-top)) 20px 6px;
    font-family:'Playfair Display',serif; font-weight:700; color:var(--brown);
    font-size:20px;
  }
  .page-sub{ padding:0 20px 14px; font-size:11px; color:rgba(90,54,27,0.55); }

  .section{ margin-bottom:22px; }

  /* Banner */
  .banner{
    position:relative; display:block; text-decoration:none; overflow:hidden;
    margin:0 16px; border-radius:16px;
    height:130px;
    background-size:cover; background-position:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
  }
  .banner.tall{ height:170px; }
  .banner::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.6) 100%);
  }
  .banner-label{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:10px 16px; display:flex; align-items:flex-end; justify-content:space-between;
  }
  .banner-title{
    font-family:'Playfair Display',serif; font-weight:700; color:#fff;
    font-size:17px; text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .banner-sub{ font-size:10px; color:rgba(255,255,255,0.85); font-weight:300; margin-top:2px; }
  .banner-cta{
    flex-shrink:0; font-size:11px; font-weight:600; color:#fff;
    background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.5);
    border-radius:999px; padding:6px 14px; backdrop-filter:blur(2px);
    white-space:nowrap;
  }

  .bg-comfort{ background-image:linear-gradient(135deg,#5A361B,#8A5A30); }
  .bg-signature{ background-image:linear-gradient(135deg,#C9A44A,#8A6B2A); }
  .bg-special{ background-image:linear-gradient(135deg,#E8621A,#B8410A); }
  .bg-omakase{ background-image:linear-gradient(135deg,#E8621A,#B8410A); }
  .bg-tarot{ background-image:linear-gradient(135deg,#2D1A5A,#1A0F3A); }

  /* Teaser row */
  .teaser-group-label{
    font-size:11px; font-weight:700; color:#E8863A;
    background:#FFF3E8; border:2px solid #F0E4D8; border-radius:999px;
    padding:4px 12px; margin:12px 0 0 16px; display:inline-block;
  }
  .teaser-row{
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:8px 16px 2px; scrollbar-width:none;
  }
  .teaser-row::-webkit-scrollbar{ display:none; }
  .teaser-card{
    flex:0 0 100px; scroll-snap-align:start; text-decoration:none;
    background:#fff; border:1px solid rgba(90,54,27,0.1); border-radius:12px;
    overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.05);
  }
  .teaser-img{ width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#F0E4D8; }
  .teaser-name{
    font-size:10.5px; font-weight:600; color:var(--brown); padding:6px 8px 0;
    line-height:1.25; min-height:26px;
  }
  .teaser-price{ font-size:10.5px; font-weight:700; color:var(--orange); padding:2px 8px 8px; }
  .teaser-loading{ font-size:11px; color:rgba(90,54,27,0.4); padding:12px 16px; }
</style>
</head>
<body>

<a href="https://orangecat-tarot.vercel.app/collection.html" class="collection-fab" title="สมุดสะสมของฉัน">📖</a>

<div class="page-title">🐱 กาแฟแมวส้ม</div>
<div class="page-sub">เลือกเมนูที่ใช่สำหรับวันนี้</div>

<div id="sections"></div>

<script>
  const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // แก้ตรงนี้ทีเดียวเมื่อ Fah ส่งรูป banner มาแทน — ใส่ URL แทน null ตัวไหนก็โผล่ทันที
  const TILE_IMAGES = {
    comfort:   "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/CA309633-E509-4943-8030-DC692B0291AE.png",
    signature: "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/6FBCF571-2ED5-49A0-A747-917064EA46E8.png",
    special:   "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/86972194-5706-42D8-8762-DF76806D5B96.png",
    omakase:   "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/1312691B-D90E-4889-92A3-9E5E0C1F303D.png",
    tarot:     "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/CB422F0C-A027-4DE1-A708-53502D78A3B7.png",
  };

  // กลุ่มย่อยที่ดึงมาโชว์เป็นแถวตัวอย่างเมนู ต่อ section — หนึ่งกลุ่ม = หนึ่งแถวเลื่อนแนวนอน
  // (อิงตรรกะเดียวกับ COFFEE_CATS/MATCHA_CATS/other ใน order.html)
  const TEASER_GROUPS = {
    comfort: [
      { label: '☕ กลุ่มกาแฟ',    cats: ['espresso','dirty','signature'] },
      { label: '🍵 กลุ่มชาเขียว', cats: ['matcha'] },
      { label: '🥤 อื่นๆ',        cats: ['cocoa','thai_tea','yogurt'] },
    ],
    signature: [
      { label: null, cats: [] }, // ยังไม่มีเมนู Signature จริง — โชว์ "เร็วๆ นี้"
    ],
    special: [
      { label: null, cats: ['special_of_month'] },
    ],
  };

  const SECTIONS = [
    { key:'comfort',   href:'order.html?tab=comfort',   title:'Your Comfort Drink',   sub:'เมนูประจำร้าน 14 แก้ว',           fallback:'bg-comfort',   cta:'ดูเมนู →',    teaser:true },
    { key:'signature', href:'order.html?tab=signature', title:'Signature',            sub:'ซิกเนเจอร์ประจำร้าน',              fallback:'bg-signature', cta:'ดูเมนู →',    teaser:true },
    { key:'special',   href:'order.html?tab=special',   title:'Special of the Month', sub:'เมนูพิเศษประจำเดือน',             fallback:'bg-special',   cta:'ดูเมนู →',    teaser:true },
    { key:'omakase',   href:'order.html?tab=omakase',   title:'Omakase',              sub:'230.-/สัปดาห์ — 3 แก้วเซอร์ไพรส์', fallback:'bg-omakase',   cta:'จองเลย →',    teaser:false, tall:true },
    { key:'tarot',     href:'https://orangecat-tarot.vercel.app/', title:'กาแฟแมวสุ่ม', sub:'จั่วไพ่ 1 ใบ ให้อาบุ้งงงทำนายให้', fallback:'bg-tarot',    cta:'จั่วไพ่ →',   teaser:false, tall:true },
  ];

  const wrap = document.getElementById('sections');

  SECTIONS.forEach(s => {
    const section = document.createElement('div');
    section.className = 'section';

    const banner = document.createElement('a');
    banner.className = 'banner' + (s.tall ? ' tall' : '') + (TILE_IMAGES[s.key] ? '' : ' ' + s.fallback);
    banner.href = s.href;
    if (TILE_IMAGES[s.key]) banner.style.backgroundImage = `url('${TILE_IMAGES[s.key]}')`;
    banner.innerHTML = `
      <div class="banner-label">
        <div>
          <div class="banner-title">${s.title}</div>
          <div class="banner-sub">${s.sub}</div>
        </div>
        <div class="banner-cta">${s.cta}</div>
      </div>
    `;
    section.appendChild(banner);

    if (s.teaser && TEASER_GROUPS[s.key]) {
      TEASER_GROUPS[s.key].forEach((grp, idx) => {
        if (grp.label) {
          const label = document.createElement('div');
          label.className = 'teaser-group-label';
          label.textContent = grp.label;
          section.appendChild(label);
        }
        const row = document.createElement('div');
        row.className = 'teaser-row';
        row.innerHTML = `<div class="teaser-loading">กำลังโหลดเมนู...</div>`;
        row.dataset.key = s.key;
        row.dataset.groupIdx = idx;
        section.appendChild(row);
      });
    }

    wrap.appendChild(section);
  });

  async function loadTeasers() {
    const { data, error } = await sb
      .from('menu_items')
      .select('name, price, category, image_url, sort_order, omakase_only')
      .order('sort_order', { ascending: true, nullsFirst: false })
      .order('id', { ascending: true });

    if (error || !data) return;
    const items = data.filter(it => !it.omakase_only);

    Object.keys(TEASER_GROUPS).forEach(key => {
      const href = SECTIONS.find(s => s.key === key).href;
      TEASER_GROUPS[key].forEach((grp, idx) => {
        const row = document.querySelector(`.teaser-row[data-key="${key}"][data-group-idx="${idx}"]`);
        if (!row) return;
        const matched = items.filter(it => grp.cats.includes(it.category));
        if (matched.length === 0) {
          row.innerHTML = `<div class="teaser-loading">เร็วๆ นี้</div>`;
          return;
        }
        row.innerHTML = matched.map(it => `
          <a class="teaser-card" href="${href}">
            <img class="teaser-img" src="${it.image_url || ''}" alt="${it.name}" onerror="this.style.opacity=0">
            <div class="teaser-name">${it.name}</div>
            <div class="teaser-price">${it.price} บาท</div>
          </a>
        `).join('');
      });
    });
  }

  loadTeasers();
</script>

</body>
</html>
