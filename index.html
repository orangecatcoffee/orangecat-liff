<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>เมนู — กาแฟแมวส้ม</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F7EDE0; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    font-family:'Mitr',sans-serif;
    background:var(--cream);
    height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .collection-fab{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:60;
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#E8621A,#F0894A);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; text-decoration:none;
    box-shadow:0 4px 14px rgba(232,98,26,0.4);
  }

  .tiles{ flex:1; display:flex; flex-direction:column; min-height:0; }

  .tile{
    flex:1; position:relative; display:flex; align-items:flex-end;
    text-decoration:none; overflow:hidden;
    background-size:cover; background-position:center;
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .tile::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%);
  }
  .tile-label{
    position:relative; z-index:2; width:100%;
    padding:10px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .tile-title{
    font-family:'Playfair Display',serif; font-weight:700; color:#fff;
    font-size:clamp(15px, 4.2vw, 19px);
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .tile-sub{ font-size:10px; color:rgba(255,255,255,0.85); font-weight:300; margin-top:2px; }
  .tile-arrow{ color:#fff; font-size:16px; opacity:0.9; }

  /* พื้นหลังชั่วคราว (placeholder) จนกว่า Fah จะส่งรูปมาแทน — แก้ตรง TILE_IMAGES ด้านล่างไฟล์นี้ */
  .bg-comfort{ background-image:linear-gradient(135deg,#5A361B,#8A5A30); }
  .bg-signature{ background-image:linear-gradient(135deg,#C9A44A,#8A6B2A); }
  .bg-special{ background-image:linear-gradient(135deg,#E8621A,#B8410A); }
  .bg-tarot{ background-image:linear-gradient(135deg,#2D1A5A,#1A0F3A); }
</style>
</head>
<body>

<a href="https://orangecat-tarot.vercel.app/collection.html" class="collection-fab" title="สมุดสะสมของฉัน">📖</a>

<div class="tiles" id="tiles"></div>

<script>
  // ===== แก้ตรงนี้ทีเดียวเมื่อ Fah ส่งรูปมาครบ — ใส่ URL แทน null ตัวไหนก็โผล่ทันที ไม่ต้องแก้ส่วนอื่น =====
  const TILE_IMAGES = {
    comfort:   null,
    signature: null,
    special:   null,
    omakase:   "https://nhzjnutvirjgiclkkfgx.supabase.co/storage/v1/object/public/menu-images/599CE900-99B0-4FC3-8C3E-33ED2F270ED7.png",
    tarot:     null,
  };

  const TILES = [
    { key:'comfort',   href:'order.html?tab=comfort',   title:'Your Comfort Drink',   sub:'เมนูประจำร้าน 14 แก้ว', fallback:'bg-comfort' },
    { key:'signature', href:'order.html?tab=signature', title:'Signature',            sub:'ซิกเนเจอร์ประจำร้าน',   fallback:'bg-signature' },
    { key:'special',   href:'order.html?tab=special',   title:'Special of the Month', sub:'เมนูพิเศษประจำเดือน',  fallback:'bg-special' },
    { key:'omakase',   href:'order.html?tab=omakase',   title:'Omakase',              sub:'230.-/สัปดาห์ — 3 แก้วเซอร์ไพรส์', fallback:'bg-special' },
    { key:'tarot',     href:'https://orangecat-tarot.vercel.app/', title:'กาแฟแมวสุ่ม', sub:'จั่วไพ่ 1 ใบ ให้อาบุ้งงงทำนายให้', fallback:'bg-tarot' },
  ];

  const wrap = document.getElementById('tiles');
  TILES.forEach(t => {
    const a = document.createElement('a');
    a.className = 'tile' + (TILE_IMAGES[t.key] ? '' : ' ' + t.fallback);
    a.href = t.href;
    if (TILE_IMAGES[t.key]) a.style.backgroundImage = `url('${TILE_IMAGES[t.key]}')`;
    a.innerHTML = `
      <div class="tile-label">
        <div>
          <div class="tile-title">${t.title}</div>
          <div class="tile-sub">${t.sub}</div>
        </div>
        <div class="tile-arrow">→</div>
      </div>
    `;
    wrap.appendChild(a);
  });
</script>

</body>
</html>
